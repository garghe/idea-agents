[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-agents"
version = "0.1.0"
description = "IDEA (Intake, Design & Evaluation Agents): an agentic platform where multiple Claude agents, with people reviewing and deciding at set points, turn a business request into a reviewed design and a story backlog."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "jsonschema>=4.20",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "boto3>=1.34"]

[project.scripts]
idea-agents = "idea_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lambdas", "infra"]
