[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-cloud"
version = "0.1.0"
description = "Multi-agent pipeline that turns a business request into a reviewed design and a story backlog, using Claude agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "boto3>=1.34"]

[project.scripts]
agentpipe = "agentpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lambdas", "infra"]
